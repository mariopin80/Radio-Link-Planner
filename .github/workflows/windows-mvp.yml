name: Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-mvp.yml"
      - "assets/**"
      - "examples/**"
      - "installer/**"
      - "pyproject.toml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "vendor/**"

permissions:
  contents: write

concurrency:
  group: windows-validation-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plots,geo,models,desktop]"

      - name: Install local MapLibre report assets
        run: npm install --prefix .map-deps maplibre-gl@5.24.0

      - name: Build official NTIA ITM library
        run: python scripts/build_itm.py

      - name: Install official ITU-R P.1812/P.2001 digital products
        run: python scripts/bootstrap_itu_data.py

      - name: Run scientific test suite
        run: pytest

      - name: Build portable desktop application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --noupx `
            --windowed `
            --onedir `
            --name RadioLinkPlanner `
            --version-file "scripts/windows_version_info.txt" `
            --icon "assets/app-icon.ico" `
            --add-data "vendor/Py1812-NOTICE.txt;licenses" `
            --paths src `
            --add-data "assets;assets" `
            --add-data "examples/morro_jacu_palmira.json;examples" `
            --add-data "tests/reference/morro_jacu_palmira/terrain_profile.csv;tests/reference/morro_jacu_palmira" `
            --add-data ".map-deps/node_modules/maplibre-gl/dist/maplibre-gl.js;map-assets" `
            --add-data ".map-deps/node_modules/maplibre-gl/dist/maplibre-gl.css;map-assets" `
            --add-data ".map-deps/node_modules/maplibre-gl/LICENSE.txt;map-assets" `
            --add-binary "vendor/ntia-itm/build/itm.dll;vendor/ntia-itm/build" `
            --collect-submodules Py1812 `
            --collect-submodules Py2001 `
            --collect-all webview `
            --collect-all rasterio `
            --copy-metadata Py1812 `
            --copy-metadata Py2001 `
            scripts/windows_gui.py

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          Copy-Item `
            -Path "dist\RadioLinkPlanner" `
            -Destination "smoke-package" `
            -Recurse
          $process = Start-Process `
            -FilePath "smoke-package\RadioLinkPlanner.exe" `
            -ArgumentList "--smoke-test", "smoke-output" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path "smoke-output\smoke-error.txt") {
              Get-Content "smoke-output\smoke-error.txt"
            }
            exit $process.ExitCode
          }
          python scripts/verify_release_reports.py "smoke-output/languages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item "smoke-package" -Recurse -Force

      - name: Reject redistribution of ITU integral digital products
        shell: pwsh
        run: |
          $forbiddenNames = @(
            "P1812.npz",
            "P2001.npz",
            "DN50.TXT",
            "N050.TXT",
            "DN_Median.txt",
            "DN_SubSlope.txt",
            "DN_SupSlope.txt",
            "dndz_01.txt",
            "Esarain_Mt_v5.txt",
            "Esarain_Pr6_v5.txt",
            "Esarain_Beta_v5.txt",
            "FoEs0.1.txt",
            "FoEs01.txt",
            "FoEs10.txt",
            "FoEs50.txt",
            "h0.txt",
            "surfwv_50_fixed.txt",
            "TropoClim.txt"
          )
          $forbidden = Get-ChildItem `
            -Path "dist\RadioLinkPlanner" `
            -Recurse `
            -File |
            Where-Object { $_.Name -cin $forbiddenNames }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error $_.FullName }
            throw "ITU integral digital products must not be redistributed."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\RadioLinkPlanner\*" `
            -DestinationPath "RadioLinkPlanner-0.5-Windows-x64.zip"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" `
            -OutFile $download
          $signature = Get-AuthenticodeSignature $download
          if (
            $signature.Status -ne "Valid" -or
            $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\."
          ) {
            throw "The Inno Setup download does not have the expected signature."
          }
          $setup = Start-Process `
            -FilePath $download `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" `
            -Wait `
            -PassThru
          if ($setup.ExitCode -ne 0) {
            exit $setup.ExitCode
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler not found at $compiler"
          }
          & $compiler "installer\RadioLinkPlanner.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Smoke-test upgrade, shortcuts and installed application
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Resolve-Path `
            "installer-output\RadioLinkPlanner-0.5-Windows-x64-Setup.exe"
          $installDirectory = Join-Path $env:RUNNER_TEMP "RadioLinkPlanner"
          $smokeOutput = Join-Path $env:RUNNER_TEMP "rlp-installer-smoke"
          $previousDirectory = Join-Path $env:RUNNER_TEMP "rlp-previous-installer"
          gh release download "v0.4.3" `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern "RadioLinkPlanner-0.4.3-Windows-x64-Setup.exe" `
            --dir $previousDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previousSetup = Start-Process `
            -FilePath (Join-Path $previousDirectory "RadioLinkPlanner-0.4.3-Windows-x64-Setup.exe") `
            -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-",
              "/TASKS=desktopicon", "/DIR=$installDirectory"
            ) `
            -Wait -PassThru
          if ($previousSetup.ExitCode -ne 0) { exit $previousSetup.ExitCode }
          $setup = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/SP-",
              "/TASKS=desktopicon",
              "/DIR=$installDirectory"
            ) `
            -Wait `
            -PassThru
          if ($setup.ExitCode -ne 0) {
            exit $setup.ExitCode
          }
          & "scripts\verify_windows_shortcuts.ps1" `
            -InstallDirectory $installDirectory -Version "0.5"
          $process = Start-Process `
            -FilePath "$installDirectory\RadioLinkPlanner.exe" `
            -ArgumentList "--smoke-test", $smokeOutput `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path "$smokeOutput\smoke-error.txt") {
              Get-Content "$smokeOutput\smoke-error.txt"
            }
            exit $process.ExitCode
          }
          python scripts/verify_release_reports.py "$smokeOutput/languages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ituDataDirectory = Join-Path `
            $env:LOCALAPPDATA `
            "RadioLinkPlanner\ITU-R"
          foreach ($relativePath in @(
            "Py1812\P1812.npz",
            "Py2001\P2001.npz"
          )) {
            $dataPath = Join-Path $ituDataDirectory $relativePath
            if (-not (Test-Path $dataPath)) {
              throw "Expected user-scoped ITU-R data not found: $dataPath"
            }
          }
          $installedProducts = Get-ChildItem `
            -Path $installDirectory `
            -Recurse `
            -File |
            Where-Object { $_.Name -cin @("P1812.npz", "P2001.npz") }
          if ($installedProducts) {
            $installedProducts | ForEach-Object { Write-Error $_.FullName }
            throw "ITU-R data must not be written inside the installation."
          }
          $uninstaller = Get-ChildItem `
            -Path $installDirectory `
            -Filter "unins*.exe" |
            Select-Object -First 1
          if (-not $uninstaller) {
            throw "Uninstaller not found after installation."
          }
          $uninstall = Start-Process `
            -FilePath $uninstaller.FullName `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -Wait `
            -PassThru
          if ($uninstall.ExitCode -ne 0) {
            exit $uninstall.ExitCode
          }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "RadioLinkPlanner-0.5-Windows-x64.zip",
            "installer-output\RadioLinkPlanner-0.5-Windows-x64-Setup.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 $file
            "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii "SHA256SUMS.txt"

      - name: Publish private Windows validation release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.5"
          $currentHead = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($currentHead -ne $env:GITHUB_SHA) {
            Write-Host "A newer commit is being validated; skipping this release."
            exit 0
          }
          gh release view `
            $tag `
            --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            $isPrerelease = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease
            if ($isPrerelease -ne "true") { throw "Refusing to replace a stable release." }
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" `
              -f "sha=$env:GITHUB_SHA" -F force=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload `
              $tag `
              "RadioLinkPlanner-0.5-Windows-x64.zip" `
              "installer-output\RadioLinkPlanner-0.5-Windows-x64-Setup.exe" `
              "SHA256SUMS.txt" `
              --clobber `
              --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create `
              $tag `
              "RadioLinkPlanner-0.5-Windows-x64.zip" `
              "installer-output\RadioLinkPlanner-0.5-Windows-x64-Setup.exe" `
              "SHA256SUMS.txt" `
              --target "$env:GITHUB_SHA" `
              --title "Radio Link Planner 0.5" `
              --notes-file "docs/release-0.5.md" `
              --prerelease `
              --latest=false `
              --repo "$env:GITHUB_REPOSITORY"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: RadioLinkPlanner-0.5-Windows-x64
          path: |
            RadioLinkPlanner-0.5-Windows-x64.zip
            installer-output/RadioLinkPlanner-0.5-Windows-x64-Setup.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-0.5-reports
          path: smoke-output
          retention-days: 14

