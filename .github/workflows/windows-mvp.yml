name: Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/v0.6.3
      - release/v0.6.3-publish
    paths:
      - ".github/workflows/windows-mvp.yml"
      - ".github/workflows/tests.yml"
      - "assets/**"
      - "examples/**"
      - "installer/**"
      - "pyproject.toml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "vendor/**"

permissions:
  contents: write

concurrency:
  group: windows-validation-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RLP_RELEASE_VERSION: "0.6.3"
      RLP_SETUP_FILE: RadioLinkPlanner-0.6.3-Windows-x64-Setup.exe
      RLP_PREVIOUS_TAG: "v0.6.2"
      RLP_PREVIOUS_SETUP_FILE: RadioLinkPlanner-0.6.2-Windows-x64-Setup-r2.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plots,geo,models,desktop]"

      - name: Install local MapLibre report assets
        run: npm install --prefix .map-deps maplibre-gl@5.24.0

      - name: Build official NTIA ITM library
        run: python scripts/build_itm.py

      - name: Install official ITU-R P.1812/P.2001 digital products
        run: python scripts/bootstrap_itu_data.py

      - name: Run scientific test suite
        run: pytest -k "not test_preview_simulation_and_explicit_application and not test_ui_languages_projects_about_and_single_remaining_time"

      - name: Run Windows interface tests in fresh Python processes
        shell: pwsh
        run: |
          python -m pytest tests/test_height_optimization.py::test_preview_simulation_and_explicit_application
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_i18n.py::test_ui_languages_projects_about_and_single_remaining_time
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build desktop application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --noupx `
            --windowed `
            --onedir `
            --name RadioLinkPlanner `
            --version-file "scripts/windows_version_info.txt" `
            --icon "assets/app-icon.ico" `
            --add-data "vendor/Py1812-NOTICE.txt;licenses" `
            --add-data "vendor/Py2001-NOTICE.txt;licenses" `
            --add-data "vendor/ntia-itm/LICENSE.md;licenses" `
            --add-data "vendor/ntia-itm/NOTICE.md;licenses" `
            --add-data "legal/THIRD_PARTY_NOTICES.txt;licenses" `
            --paths src `
            --add-data "assets;assets" `
            --add-data "src/radiolink/fonts;radiolink/fonts" `
            --add-data "examples/morro_jacu_palmira.json;examples" `
            --add-data "tests/reference/morro_jacu_palmira/terrain_profile.csv;tests/reference/morro_jacu_palmira" `
            --add-data ".map-deps/node_modules/maplibre-gl/dist/maplibre-gl.js;map-assets" `
            --add-data ".map-deps/node_modules/maplibre-gl/dist/maplibre-gl.css;map-assets" `
            --add-data ".map-deps/node_modules/maplibre-gl/LICENSE.txt;map-assets" `
            --add-binary "vendor/ntia-itm/build/itm.dll;vendor/ntia-itm/build" `
            --collect-submodules Py1812 `
            --collect-submodules Py2001 `
            --collect-all webview `
            --collect-all rasterio `
            --copy-metadata Py1812 `
            --copy-metadata Py2001 `
            scripts/windows_gui.py

      - name: Verify bundled notices
        shell: pwsh
        run: |
          $names = @(
            "Py1812-NOTICE.txt", "Py2001-NOTICE.txt",
            "THIRD_PARTY_NOTICES.txt", "LICENSE.md", "NOTICE.md", "LICENSE-DejaVu.txt"
          )
          foreach ($name in $names) {
            $found = Get-ChildItem -Path "dist/RadioLinkPlanner" -Recurse -File -Filter $name
            if (-not $found) { throw "Missing required third-party notice: $name" }
          }

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          Copy-Item `
            -Path "dist\RadioLinkPlanner" `
            -Destination "smoke-package" `
            -Recurse
          $process = Start-Process `
            -FilePath "smoke-package\RadioLinkPlanner.exe" `
            -ArgumentList "--smoke-test", "smoke-output" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path "smoke-output\smoke-error.txt") {
              Get-Content "smoke-output\smoke-error.txt"
            }
            exit $process.ExitCode
          }
          python scripts/verify_release_reports.py "smoke-output/languages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item "smoke-package" -Recurse -Force

      - name: Reject redistribution of ITU integral digital products
        shell: pwsh
        run: |
          $forbiddenNames = @(
            "P1812.npz",
            "P2001.npz",
            "DN50.TXT",
            "N050.TXT",
            "DN_Median.txt",
            "DN_SubSlope.txt",
            "DN_SupSlope.txt",
            "dndz_01.txt",
            "Esarain_Mt_v5.txt",
            "Esarain_Pr6_v5.txt",
            "Esarain_Beta_v5.txt",
            "FoEs0.1.txt",
            "FoEs01.txt",
            "FoEs10.txt",
            "FoEs50.txt",
            "h0.txt",
            "surfwv_50_fixed.txt",
            "TropoClim.txt"
          )
          $forbidden = Get-ChildItem `
            -Path "dist\RadioLinkPlanner" `
            -Recurse `
            -File |
            Where-Object { $_.Name -cin $forbiddenNames }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error $_.FullName }
            throw "ITU integral digital products must not be redistributed."
          }

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" `
            -OutFile $download
          $signature = Get-AuthenticodeSignature $download
          if (
            $signature.Status -ne "Valid" -or
            $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\."
          ) {
            throw "The Inno Setup download does not have the expected signature."
          }
          $setup = Start-Process `
            -FilePath $download `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" `
            -Wait `
            -PassThru
          if ($setup.ExitCode -ne 0) {
            exit $setup.ExitCode
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler not found at $compiler"
          }
          & $compiler "installer\RadioLinkPlanner.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify installer terms and acceptance
        shell: pwsh
        run: |
          python scripts/verify_windows_installer_terms.py "installer-output/$env:RLP_SETUP_FILE"

      - name: Smoke-test upgrade, shortcuts and installed application
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Resolve-Path `
            "installer-output\$env:RLP_SETUP_FILE"
          $installDirectory = Join-Path $env:RUNNER_TEMP "RadioLinkPlanner"
          $smokeOutput = Join-Path $env:RUNNER_TEMP "rlp-installer-smoke"
          $previousDirectory = Join-Path $env:RUNNER_TEMP "rlp-previous-installer"
          gh release download "$env:RLP_PREVIOUS_TAG" `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern $env:RLP_PREVIOUS_SETUP_FILE `
            --dir $previousDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previousSetup = Start-Process `
            -FilePath (Join-Path $previousDirectory $env:RLP_PREVIOUS_SETUP_FILE) `
            -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-",
              "/ACCEPTTERMS=1", "/TASKS=desktopicon", "/DIR=$installDirectory"
            ) `
            -Wait -PassThru
          if ($previousSetup.ExitCode -ne 0) { exit $previousSetup.ExitCode }
          $setup = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/SP-",
              "/ACCEPTTERMS=1",
              "/TASKS=desktopicon"
            ) `
            -Wait `
            -PassThru
          if ($setup.ExitCode -ne 0) {
            exit $setup.ExitCode
          }
          & "scripts\verify_windows_shortcuts.ps1" `
            -InstallDirectory $installDirectory -Version "$env:RLP_RELEASE_VERSION"
          $process = Start-Process `
            -FilePath "$installDirectory\RadioLinkPlanner.exe" `
            -ArgumentList "--smoke-test", $smokeOutput `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path "$smokeOutput\smoke-error.txt") {
              Get-Content "$smokeOutput\smoke-error.txt"
            }
            exit $process.ExitCode
          }
          python scripts/verify_release_reports.py "$smokeOutput/languages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ituDataDirectory = Join-Path `
            $env:LOCALAPPDATA `
            "RadioLinkPlanner\ITU-R"
          foreach ($relativePath in @(
            "Py1812\P1812.npz",
            "Py2001\P2001.npz"
          )) {
            $dataPath = Join-Path $ituDataDirectory $relativePath
            if (-not (Test-Path $dataPath)) {
              throw "Expected user-scoped ITU-R data not found: $dataPath"
            }
          }
          $installedProducts = Get-ChildItem `
            -Path $installDirectory `
            -Recurse `
            -File |
            Where-Object { $_.Name -cin @("P1812.npz", "P2001.npz") }
          if ($installedProducts) {
            $installedProducts | ForEach-Object { Write-Error $_.FullName }
            throw "ITU-R data must not be written inside the installation."
          }
          $uninstaller = Get-ChildItem `
            -Path $installDirectory `
            -Filter "unins*.exe" |
            Select-Object -First 1
          if (-not $uninstaller) {
            throw "Uninstaller not found after installation."
          }
          $uninstall = Start-Process `
            -FilePath $uninstaller.FullName `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -Wait `
            -PassThru
          if ($uninstall.ExitCode -ne 0) {
            exit $uninstall.ExitCode
          }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "installer-output\$env:RLP_SETUP_FILE"
          )
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 $file
            "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii "SHA256SUMS.txt"

      - name: Publish validated Windows installer
        if: >-
          github.repository == 'mariopin80/Radio-Link-Planner' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v0.6.3-publish')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RLP_RELEASE_VERSION
          $tag = "v$version"
          $repository = $env:GITHUB_REPOSITORY
          $branch = $env:GITHUB_REF_NAME
          $currentHead = gh api "repos/$repository/git/ref/heads/$branch" --jq .object.sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($currentHead -ne $env:GITHUB_SHA) {
            Write-Host "A newer commit is being validated; skipping publication."
            exit 0
          }
          $null = gh api "repos/$repository/releases/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists."
            exit 0
          }
          $tagRef = git ls-remote origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tagRef -and ($tagRef -split '\s+')[0] -ne $env:GITHUB_SHA) {
            throw "Tag $tag points to a different commit."
          }
          gh release create $tag "installer-output/$env:RLP_SETUP_FILE" "SHA256SUMS.txt" `
            --repo $repository --target $env:GITHUB_SHA `
            --prerelease --title "PU2PTU - Radio Link Planner $version" `
            --notes-file "docs/release-$version.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $release = gh api "repos/$repository/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = $release.assets | Where-Object { $_.name -ceq $env:RLP_SETUP_FILE }
          $hash = (Get-FileHash -Algorithm SHA256 "installer-output/$env:RLP_SETUP_FILE").Hash.ToLowerInvariant()
          if ($asset.state -ne "uploaded" -or $asset.digest -cne "sha256:$hash") {
            throw "Uploaded installer hash mismatch."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: RadioLinkPlanner-${{ env.RLP_RELEASE_VERSION }}-Windows-x64
          path: |
            installer-output/${{ env.RLP_SETUP_FILE }}
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ env.RLP_RELEASE_VERSION }}-reports
          path: smoke-output
          retention-days: 14

