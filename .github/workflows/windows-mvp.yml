name: Windows MVP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-mvp.yml"
      - "examples/**"
      - "pyproject.toml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "vendor/**"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plots,geo,models,desktop]"

      - name: Install local MapLibre report assets
        run: npm install --prefix .map-deps maplibre-gl@5.24.0

      - name: Build official NTIA ITM library
        run: python scripts/build_itm.py

      - name: Install official ITU-R P.1812/P.2001 digital products
        run: python scripts/bootstrap_itu_data.py

      - name: Run scientific test suite
        run: pytest

      - name: Build portable desktop application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name RadioLinkPlanner `
            --paths src `
            --add-data "examples/morro_jacu_palmira.json;examples" `
            --add-data "tests/reference/morro_jacu_palmira/terrain_profile.csv;tests/reference/morro_jacu_palmira" `
            --add-data ".map-deps/node_modules/maplibre-gl/dist/maplibre-gl.js;map-assets" `
            --add-data ".map-deps/node_modules/maplibre-gl/dist/maplibre-gl.css;map-assets" `
            --add-data ".map-deps/node_modules/maplibre-gl/LICENSE.txt;map-assets" `
            --add-binary "vendor/ntia-itm/build/itm.dll;vendor/ntia-itm/build" `
            --collect-submodules Py1812 `
            --collect-submodules Py2001 `
            --collect-all rasterio `
            --copy-metadata Py1812 `
            --copy-metadata Py2001 `
            scripts/windows_gui.py

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          Copy-Item `
            -Path "dist\RadioLinkPlanner" `
            -Destination "smoke-package" `
            -Recurse
          $process = Start-Process `
            -FilePath "smoke-package\RadioLinkPlanner.exe" `
            -ArgumentList "--smoke-test", "smoke-output" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path "smoke-output\smoke-error.txt") {
              Get-Content "smoke-output\smoke-error.txt"
            }
            exit $process.ExitCode
          }
          Remove-Item "smoke-package" -Recurse -Force

      - name: Reject redistribution of ITU integral digital products
        shell: pwsh
        run: |
          $forbiddenNames = @(
            "P1812.npz",
            "P2001.npz",
            "DN50.TXT",
            "N050.TXT",
            "DN_Median.txt",
            "DN_SubSlope.txt",
            "DN_SupSlope.txt",
            "dndz_01.txt",
            "Esarain_Mt_v5.txt",
            "Esarain_Pr6_v5.txt",
            "Esarain_Beta_v5.txt",
            "FoEs0.1.txt",
            "FoEs01.txt",
            "FoEs10.txt",
            "FoEs50.txt",
            "h0.txt",
            "surfwv_50_fixed.txt",
            "TropoClim.txt"
          )
          $forbidden = Get-ChildItem `
            -Path "dist\RadioLinkPlanner" `
            -Recurse `
            -File |
            Where-Object { $_.Name -cin $forbiddenNames }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error $_.FullName }
            throw "ITU integral digital products must not be redistributed."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\RadioLinkPlanner\*" `
            -DestinationPath "RadioLinkPlanner-0.2-Windows-x64.zip"

      - name: Publish private MVP prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.0-mvp.1"
          gh release view `
            $tag `
            --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload `
              $tag `
              "RadioLinkPlanner-0.2-Windows-x64.zip" `
              --clobber `
              --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create `
              $tag `
              "RadioLinkPlanner-0.2-Windows-x64.zip" `
              --target "$env:GITHUB_SHA" `
              --title "Radio Link Planner 0.2 MVP" `
              --notes "MVP desktop para Windows x64 com editor de enlace, terreno Copernicus GLO-30 automático, mapa MapLibre, ITM, P.1812, P.2001 e Monte Carlo." `
              --prerelease `
              --repo "$env:GITHUB_REPOSITORY"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: RadioLinkPlanner-0.2-Windows-x64
          path: RadioLinkPlanner-0.2-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
